name: Build eckit from source
description: >
  Configures, builds and installs the already-checked-out eckit against the
  resolved dependency prefixes, and leaves the build tree in place so the caller
  can run ctest against it without reconfiguring. Caller must have already run
  actions/checkout@v6 in the same job — the action reads the source from
  $GITHUB_WORKSPACE.

inputs:
  cmake-prefix-path:
    description: 'Semicolon-separated prefixes of the resolved deps (ecbuild, stack-deps)'
    required: true
  cxx-compiler:
    description: 'C++ compiler binary including version (e.g. clang++-18, g++-13)'
    required: true
  build-type:
    description: 'CMake build type (e.g. Release, Debug, RelWithDebInfo)'
    required: true

outputs:
  install-path:
    description: 'Absolute path where eckit is installed'
    value: ${{ steps.set-paths.outputs.install-path }}
  build-dir:
    description: 'Absolute path of the build tree, for ctest'
    value: ${{ steps.set-paths.outputs.build-dir }}

runs:
  using: composite
  steps:
    - name: Get install prefix
      id: prefix
      uses: ecmwf/ci-infrastructure/actions/install-prefix@main

    - name: Set paths
      id: set-paths
      shell: bash
      run: |
        set -euo pipefail
        {
          echo "install-path=${{ steps.prefix.outputs.base }}/eckit"
          echo "build-dir=$RUNNER_TEMP/_eckit-build"
        } >> "$GITHUB_OUTPUT"

    - name: Configure eckit
      shell: bash
      env:
        CMAKE_PREFIX_PATH_IN: ${{ inputs.cmake-prefix-path }}
        CXX_COMPILER: ${{ inputs.cxx-compiler }}
        BUILD_TYPE: ${{ inputs.build-type }}
        INSTALL_PATH: ${{ steps.set-paths.outputs.install-path }}
        BUILD_DIR: ${{ steps.set-paths.outputs.build-dir }}
      # ENABLE_AEC is on by default and pulls libaec out of the stack-deps
      # prefix. The remaining optional features (CONVEX_HULL, PROJ, SSL, CURL,
      # MPI, ...) stay at their defaults for this first rollout.
      run: |
        set -euo pipefail
        cmake -S "$GITHUB_WORKSPACE" \
              -B "$BUILD_DIR" \
              -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
              -DCMAKE_CXX_COMPILER="$CXX_COMPILER" \
              -DCMAKE_INSTALL_PREFIX="$INSTALL_PATH" \
              -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH_IN" \
              -DENABLE_TESTS=ON

    - name: Build and install eckit
      shell: bash
      env:
        BUILD_DIR: ${{ steps.set-paths.outputs.build-dir }}
      run: |
        set -euo pipefail
        cmake --build "$BUILD_DIR" --parallel "$(nproc)"
        cmake --install "$BUILD_DIR"
