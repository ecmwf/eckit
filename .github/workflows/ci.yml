name: ci

on:
  # Trigger the workflow on push to master or develop, except tag creation
  push:
    branches:
      - "master"
      - "develop"
    tags-ignore:
      - "**"

  # Trigger the workflow on pull request
  pull_request: ~

  # Trigger on public pull request approval
  pull_request_target:
    types: [labeled]

  # Trigger the workflow manually
  workflow_dispatch: ~

jobs:
  # Run CI including downstream packages on self-hosted runners
  downstream-ci:
    name: downstream-ci
    if: ${{ !github.event.pull_request.head.repo.fork && github.event.action != 'labeled' || github.event.label.name == 'approved-for-ci' }}
    uses: ecmwf/downstream-ci/.github/workflows/downstream-ci.yml@add-eckit-python
    with:
      eckit: ecmwf/eckit@${{ github.event.pull_request.head.sha || github.sha }}
      eckit-python: ecmwf/eckit@${{ github.event.pull_request.head.sha || github.sha }}
      codecov_upload: true
      clang_format: true
      clang_format_ignore: |
        src/eckit/contrib
    secrets: inherit

  # Build downstream packages on HPC
  downstream-ci-hpc:
    name: downstream-ci-hpc
    if: ${{ !github.event.pull_request.head.repo.fork && github.event.action != 'labeled' || github.event.label.name == 'approved-for-ci' }}
    uses: ecmwf/downstream-ci/.github/workflows/downstream-ci-hpc.yml@add-eckit-python
    with:
      eckit: ecmwf/eckit@${{ github.event.pull_request.head.sha || github.sha }}
      eckit-python: ecmwf/eckit-@${{ github.event.pull_request.head.sha || github.sha }}
    secrets: inherit

  notify:
    runs-on: ubuntu-latest
    needs:
      - downstream-ci
      - downstream-ci-hpc
    if: ${{ always() && !github.event.pull_request.head.repo.fork && (github.event.action != 'labeled' || github.event.label.name == 'approved-for-ci') }}
    steps:
      - name: Trigger Teams notification
        if: failure() && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        uses: ecmwf/notify-teams@v1
        with:
          incoming_webhook: ${{ secrets.MS_TEAMS_INCOMING_WEBHOOK }}
          needs_context: ${{ toJSON(needs) }}
          notify_on: |
            failure
